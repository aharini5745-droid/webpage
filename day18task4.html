<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(129, 52, 68);
        }

        .box {
            position: absolute;
            top: 150px;
            left: 500px;
            width: 300px;
            height: 300px;
            background-color: rgb(150, 199, 241);
            border-radius: 20px;
            box-shadow: 0px 0px 15px rgb(95, 236, 241);
            border: 1px solid rgba(red, green, blue, alpha)
        }

        .box form {
            margin-top: 50px;
            text-align: center;
        }

        .box label {
            width: 250px;
            height: 25px;
            background-color: rgb(150, 199, 241);
            font-size: 24px;
            font-weight: 500px;
            font-family: Calibri;
        }

        .box input {
            width: 250px;
            height: 30px;
            background-color: aliceblue;
            text-align: center;
            border: none;
            font-size: 14px;
            border-radius: 30px;
            box-shadow: 0px 0px 3px rgba(red, green, blue, alpha);

        }

        .box button {
            width: 250px;
            height: 30px;
            background-color: rgb(150, 199, 241);
            text-align: center;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            box-shadow: 0px 0px 3px rgba(red, green, blue, alpha);
        }

        .box button:hover {
            width: 250px;
            height: 30px;
            background-color: blue;
            color: white;

        }

        .span {
            margin: 0;
            padding: 0;
            font-size: 24px;
            font-weight: 500;
            font-family: calibri;
        }
    </style>
</head>

<body>
    <div class="box">
        <form name="validation">
            <label>Armstrong number</label><br> <br>
            <input type="text" name="number" id="number" placeholder="enter a number"><br> <br>
            <button type="button" onclick="validate()">submit</button><br>
            <h3>Answer</h3><span id="prime" class="span"></span>
            <script>
                function validate() {
                    let a = document.getElementById("number").value;
                    let temp = a;
                    let sum = 0;

                    while (temp > 0) {
                        let rem = temp % 10;
                        sum = sum + (rem * rem * rem);
                        temp = parseInt(temp / 10);
                    }

                    if (sum == a) {
                        document.getElementById("prime").innerHTML = "Armstrong Number";
                    } else {
                        document.getElementById("prime").innerHTML = "Not an Armstrong Number";
                    }
                }


            </script>

</body>

</html>

</form>
